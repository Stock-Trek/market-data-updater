[package]
name = "market-data-updater"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
arrow = "60.0.0"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
aws-config = "1.8.16"
aws-sdk-s3 = "1.130.0"
aws-sdk-s3-transfer-manager = "0.2.0"
bytes = "1.11.1"
chrono = "0.4.44"
exchange-gateway = { version = "0.12.5", registry = "shipyard" }
exchange-types = { version = "0.13.1", registry = "shipyard" }
futures = "0.3"
hashbrown = "0.17.1"
lambda_runtime = "1.1.3"
parquet = { version = "60.0.0", features = ["async"] }
serde_json = "1.0.149"
stock-trek-types = "0.4.2"
thiserror = "2.0.20"
type-bridge = { version = "0.6.2", registry = "shipyard" }
tokio = "1.52.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
