name: Build master and deploy to lambda

on:
  push:
    branches: master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Cargo Lambda via pip
        run: pip install cargo-lambda

      - name: Build Lambda function
        run: cargo lambda build --release --output-format zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_ECR }}"
          role-session-name: "market-data-updater-${{ github.run_id }}"
          retry-max-attempts: 3
          mask-aws-account-id: true

      - name: Update lambda code
        run: |
          aws lambda update-function-code \
            --function-name market-data-updater \
            --zip-file fileb://target/lambda/market-data-updater/bootstrap.zip
